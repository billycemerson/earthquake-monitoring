name: BMKG Earthquake Pipeline v2

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"   # Every hour - SLA: data must be fresh < 2 hours
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  DBT_PROFILES_DIR: dbt_project/profiles

jobs:
  # Job 1: Unit Tests — fast feedback, runs first
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-mock
      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # Job 2: Pipeline — only runs if unit-tests passes
  pipeline:
    name: Ingest → Transform → Enrich → Test → SLA Check
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create required directories
        run: mkdir -p warehouse data/bronze

      # ── Ingestion ────────────────────────────────────────────────────────
      - name: "Step 1/6 — Fetch BMKG API → Bronze → DuckDB"
        run: python ingestion/fetch_bmkg.py

      - name: Verify bronze snapshot created
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          FILE="data/bronze/ingestion_date=${TODAY}/earthquakes.json"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: Bronze file not found: $FILE"
            exit 1
          fi
          echo "Bronze verified: $FILE"
          python -c "
          import json
          with open('$FILE') as f: d = json.load(f)
          print(f'  ingestion_time : {d[\"ingestion_time\"]}')
          print(f'  record_count   : {d[\"record_count\"]}')
          "
      # ── dbt ───────────────────────────────────────────────────────────
      - name: "Step 2/6 — dbt deps"
        run: |
          cd dbt_project/bmkg_pipeline
          dbt deps --profiles-dir ../profiles
      - name: "Step 3/6 — dbt run"
        run: |
          cd dbt_project/bmkg_pipeline
          dbt run --profiles-dir ../profiles --target prod
      - name: "Step 4/6 — dbt test"
        run: |
          cd dbt_project/bmkg_pipeline
          dbt test --profiles-dir ../profiles --target prod
      # ── Province Enrichment ──────────────────────────────────────────
      - name: "Step 5/6 — Province Enrichment (Reverse Geocoding)"
        run: |
          python ingestion/enrich.py --pipeline
      - name: Log enrichment statistics
        run: |
          python - <<'PYEOF'
          import duckdb
          con = duckdb.connect("warehouse/bmkg.duckdb")
          
          total = con.execute("SELECT COUNT(*) FROM staging.stg_earthquake").fetchone()[0]
          enriched = con.execute(
              "SELECT COUNT(*) FROM staging.stg_earthquake WHERE province IS NOT NULL AND province != ''"
          ).fetchone()[0]
          
          pending = total - enriched
          pct = (enriched / total * 100) if total > 0 else 0
          
          print()
          print("=" * 50)
          print("  PROVINCE ENRICHMENT STATISTICS")
          print("=" * 50)
          print(f"  Total records     : {total}")
          print(f"  Enriched          : {enriched}")
          print(f"  Pending           : {pending}")
          print(f"  Enrichment %      : {pct:.1f}%")
          print("=" * 50)
          print()
          PYEOF
      # ── SLA Gate ─────────────────────────────────────────────────────────
      - name: "Step 6/6 — Monitoring Summary + SLA Gate"
        run: |
          python - <<'PYEOF'
          import duckdb, sys
          con = duckdb.connect("warehouse/bmkg.duckdb")
          row = con.execute("""
              SELECT run_time, total_records, min_magnitude, max_magnitude,
                     freshness_lag_hours, latest_event_datetime,
                     invalid_magnitude_count, pipeline_status,
                     freshness_status, anomaly_status, quality_status
              FROM monitoring.earthquake_quality_summary
          """).fetchone()
          cols = [d[0] for d in con.description]
          s = dict(zip(cols, row))
          print()
          print("=" * 58)
          print("  BMKG PIPELINE MONITORING SUMMARY")
          print("=" * 58)
          for k, v in s.items():
              icon = " OK" if str(v) == "OK" else " WARNING" if str(v) == "WARNING" else " FAILED" if str(v) == "FAILED" else ""
              print(f"  {k:<34} {v}{icon}")
          print("=" * 58)
          if s["freshness_lag_hours"] > 12:
              print(f"\nFAILED: Freshness SLA violated — {s['freshness_lag_hours']:.2f}h > 12h")
              sys.exit(1)
          if s["pipeline_status"] == "WARNING":
              print("\nWARNING: Pipeline has warnings — review summary above")
          print("\nSLA gate: PASSED")
          PYEOF
      # ── Google Sheets Export ──────────────────────────────────────────
      - name: "Export — Append Enriched Data to Google Sheet"
        env:
          GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python - <<'PYEOF'
          import duckdb, gspread, os, json
          import pandas as pd
          from oauth2client.service_account import ServiceAccountCredentials
          # Initialize DuckDB connection
          con = duckdb.connect("warehouse/bmkg.duckdb")
          
          # Fetch enriched data from staging layer with province column
          query = """
            SELECT 
              event_id,
              event_datetime,
              latitude,
              longitude,
              magnitude,
              magnitude_category,
              depth_km,
              depth_category,
              wilayah,
              dirasakan,
              province,
              ingestion_date
            FROM staging.stg_earthquake
            ORDER BY event_datetime DESC
          """
          df = con.execute(query).df()
          con.close()
          
          # Format for JSON serialization
          df_clean = df.copy()
          
          for col in df_clean.columns:
              # Convert Datetime/Timestamp to String
              if df_clean[col].dtype.kind in ['M', 'm']: 
                  df_clean[col] = df_clean[col].dt.strftime('%Y-%m-%d %H:%M:%S')
              # Convert Boolean to String 'TRUE'/'FALSE'
              elif df_clean[col].dtype.kind == 'b':
                  df_clean[col] = df_clean[col].astype(str).str.upper()
              # Convert everything else to string
              elif df_clean[col].dtype == 'object':
                  df_clean[col] = df_clean[col].astype(str)
          # Authenticate with Google Sheets API
          scope = ["https://spreadsheets.google.com/feeds", "https://www.googleapis.com/auth/drive"]
          creds_dict = json.loads(os.environ["GSHEET_CREDENTIALS"])
          creds = ServiceAccountCredentials.from_json_keyfile_dict(creds_dict, scope)
          client = gspread.authorize(creds)
          sheet = client.open_by_key(os.environ["SPREADSHEET_ID"]).worksheet("staging")
          # Enforce fixed column order — must match GSheet header exactly
          COLUMN_ORDER = [
              'event_id', 'event_datetime', 'latitude', 'longitude',
              'magnitude', 'magnitude_category', 'depth_km', 'depth_category',
              'wilayah', 'dirasakan', 'province', 'ingestion_date'
          ]
          df_clean = df_clean[COLUMN_ORDER]

          # Write header if sheet is empty
          existing_ids = sheet.col_values(1)
          if not existing_ids:
              sheet.append_row(COLUMN_ORDER)
              existing_ids = []

          # Deduplication: event_id is primary key (Column A)
          new_rows = []
          for _, row in df_clean.iterrows():
              if str(row['event_id']) not in existing_ids:
                  new_rows.append(row.values.tolist())

          # Append enriched data
          if new_rows:
              sheet.append_rows(new_rows)
              print(f"Successfully appended {len(new_rows)} enriched earthquake records.")
              enriched_count = sum(1 for r in new_rows if r[10] not in (None, '', 'None'))
              print(f"Province enrichment: {enriched_count}/{len(new_rows)} new rows have province")
          else:
              print("No new data found. Google Sheet is already up to date.")
          
          PYEOF
      # ── Artifacts ────────────────────────────────────────────────────────
      - name: Upload bronze snapshot (audit trail, 30 days)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bronze-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/bronze/
          retention-days: 30

      - name: Upload dbt docs (7 days)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dbt-docs-${{ github.run_id }}
          path: dbt_project/bmkg_pipeline/target/
          retention-days: 7